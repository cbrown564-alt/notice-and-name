name: CI

on:
  push:
    branches: [main, visual-v2-restart]
  pull_request:
    branches: [main, visual-v2-restart]

jobs:
  test-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate-manifest
