name: CI

on:
  push:
    branches: [main, visual-v2-restart]
  pull_request:
    branches: [main, visual-v2-restart]

jobs:
  content-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run validate-manifest
      - run: npm run generate-v2-full-bundle
      - run: npm run validate-v2-bundle:full
      - run: npm run lint-v2-content

  swift-tests:
    # SwiftUI + iOS/macOS-only Package.swift platforms — cannot run on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run generate-v2-full-bundle
      - run: npm run sync-ios-media
      - run: cd ios && swift test
      - name: Xcode smoke build
        run: |
          cd ios
          xcodebuild \
            -project PleasureVocabulary.xcodeproj \
            -scheme PleasureVocabulary \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
