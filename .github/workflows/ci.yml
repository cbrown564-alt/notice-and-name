name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run generate-v2-full-bundle
      - run: npm run validate-v2-bundle:full
      - run: npm run lint-v2-content

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run generate-v2-full-bundle
      - run: npm run sync-ios-media
      - run: cd ios && swift test
