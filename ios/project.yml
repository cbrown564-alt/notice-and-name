name: PleasureVocabulary
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: QCVP3CNMP6
    CODE_SIGN_STYLE: Automatic
packages:
  PleasureVocabularyNative:
    path: .
targets:
  PleasureVocabulary:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: Sync iOS Media
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/../scripts/run-sync-ios-media.sh"
    sources:
      - path: AppHost
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
    resources:
      - path: AppHost/PrivacyInfo.xcprivacy
    info:
      path: AppHost/Info.plist
      properties:
        CFBundleDisplayName: Pleasure Vocabulary
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: PleasureVocabularyNative
        product: PleasureVocabularyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pleasurevocab.app
        PRODUCT_NAME: PleasureVocabulary
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PleasureVocabulary:
    build:
      targets:
        PleasureVocabulary: all
    run:
      config: Debug
    archive:
      config: Release
